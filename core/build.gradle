apply plugin: 'java-library'
[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'

// ─── Phase 3: shared client/server networking protocol ─────────────────────
// The protocol POJOs live in top-level `shared/src` so the standalone (gradle-
// free) server can compile them with plain javac while the client sees them as
// ordinary core sources. Single source of truth; only this one line is needed.
sourceSets.main.java.srcDirs += rootProject.file('shared/src')

dependencies {
  // ─── LibGDX (موجود در پروژه) ──────────────────────────────────────────
  api "com.badlogicgames.gdx:gdx:$gdxVersion"

  // ─── FreeType font (برای pvz-skin) ────────────────────────────────────
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"

  // ─── PVZ2 UI Skin (فونت بازی + ویجت‌های Scene2D سبک‌سازی‌شده) ────────
  // شامل: PvzSkin.get(), FreeTypeSkin, فونت‌های "big"/"medium"/"default"
  api "com.github.pizpizi:pvz-skin:v0.1.1"

  // ─── TenPatch (وابستگی اجباری pvz-skin) ───────────────────────────────
  api "com.github.raeleus.TenPatch:tenpatch:5.2.3"

  // ─── libPVZ (بارگذاری و رندر انیمیشن‌های PAM بازی اصلی) ───────────────
  // شامل: TextureBank, PamPlayer
  api "com.github.pizpizi:libPVZ:v0.1.5"

  implementation "com.google.code.gson:gson:2.13.1"

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

jar {
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
